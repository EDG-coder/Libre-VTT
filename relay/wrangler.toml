# Il relay di LIBRE VTT su Cloudflare Workers (vedi docs/sito-web.md).
# Si pubblica dal workflow «Sito web», oppure a mano: cd relay && npx wrangler@4.149.0 deploy
name = "libre-vtt-relay"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[durable_objects.bindings]]
name = "STANZE"
class_name = "Stanza"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Stanza"]

[vars]
# Facoltativo: da quali siti si può entrare, separati da virgole (es. "https://libre-vtt.pages.dev").
# Vuoto = da qualsiasi sito (anche chi si fa una copia del sito).
ORIGINI = ""
