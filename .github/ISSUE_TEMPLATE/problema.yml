name: Problema
description: Qualcosa non funziona come dovrebbe
labels: [bug]
body:
  - type: textarea
    id: cosa
    attributes:
      label: Che cosa succede
      description: Che cosa volevi fare e che cosa è successo invece.
    validations:
      required: true
  - type: textarea
    id: passi
    attributes:
      label: Come farlo succedere di nuovo
      placeholder: |
        1. Apro «Conduco io»
        2. Trascino un mostro dal Compendio sulla mappa
        3. ...
    validations:
      required: true
  - type: input
    id: versione
    attributes:
      label: Versione di LIBRE VTT
      description: "Nella home, apri «Che cosa sta succedendo»: è scritta in fondo."
      placeholder: 3.8.2
    validations:
      required: true
  - type: dropdown
    id: sistema
    attributes:
      label: Sistema
      multiple: true
      options: [Windows, macOS, Linux, Android, iPhone / iPad, Browser]
    validations:
      required: true
  - type: dropdown
    id: modo
    attributes:
      label: Come stavi giocando
      options: [Da solo, Conduco io, Mi unisco, Server dedicato]
  - type: textarea
    id: altro
    attributes:
      label: Immagini o registro
      description: Uno screenshot aiuta molto. Il registro è nella cartella dei log (vedi README).
