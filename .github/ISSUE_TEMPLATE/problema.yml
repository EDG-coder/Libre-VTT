name: Problem
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: cosa
    attributes:
      label: What happens
      description: What you wanted to do and what happened instead.
    validations:
      required: true
  - type: textarea
    id: passi
    attributes:
      label: How to make it happen again
      placeholder: |
        1. I open «I'm the GM»
        2. I drag a monster from the Compendium onto the map
        3. ...
    validations:
      required: true
  - type: input
    id: versione
    attributes:
      label: LIBRE VTT version
      description: "On the home screen, open «What's happening»: it is written at the bottom."
      placeholder: 3.10.0
    validations:
      required: true
  - type: dropdown
    id: sistema
    attributes:
      label: System
      multiple: true
      options: [Windows, macOS, Linux, Android, iPhone / iPad, Browser]
    validations:
      required: true
  - type: dropdown
    id: modo
    attributes:
      label: How you were playing
      options: [Play alone, I'm the GM, Join a game, Dedicated server, Website]
  - type: textarea
    id: altro
    attributes:
      label: Pictures or log
      description: A screenshot helps a lot. The log is in the logs folder (see the README).
