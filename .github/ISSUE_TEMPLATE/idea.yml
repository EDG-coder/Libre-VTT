name: Idea
description: A new feature or an improvement
labels: [idea]
body:
  - type: textarea
    id: bisogno
    attributes:
      label: What you need at the table
      description: Describe the game situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: How you picture it
  - type: dropdown
    id: chi
    attributes:
      label: Who it is for
      multiple: true
      options: [Master, Players, Plugin authors]
