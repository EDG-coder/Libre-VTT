# La versione sito web di LIBRE VTT: una pagina di presentazione e il tavolo dove i giocatori entrano
# dal browser con il codice del master, senza installare niente (sviluppo/sito-web/costruisci.mjs).
#
# Dove va, lo decide la variabile del repository SITO_WEB (Settings → Secrets and variables →
# Actions → Variables): «cloudflare», «github» o «cloudflare,github». Senza variabile si costruisce
# soltanto, e il sito resta scaricabile dalla pagina dell'esecuzione.
#
#   Cloudflare (sito su https://libre-vtt.pages.dev, o il nome scelto in SITO_CLOUDFLARE_NOME, e il relay
#   per i giocatori del sito su Workers): segreti CLOUDFLARE_API_TOKEN (permessi «Cloudflare Pages: Edit» e
#   «Workers Scripts: Edit») e CLOUDFLARE_ACCOUNT_ID, nell'ambiente «cloudflare» (Settings → Environments)
#   aperto solo a main e ai tag v*. Il progetto Pages e il relay li crea lui la prima volta;
#   l'indirizzo del relay finisce in relay.json sul sito, da dove lo leggono il tavolo e l'app del master.
#   (Con un relay altrove: variabile SITO_RELAY = wss://…)
#   GitHub Pages (https://edg-coder.github.io/Libre-VTT/):
#     Settings → Pages → Build and deployment → Source: «GitHub Actions».
#
# Parte da sola alla fine di «Rilascio» (solo quando pubblica una versione), oppure a mano da
# Actions → Sito web → Run workflow. Dal sito si entra solo da giocatori, nella partita di un master che
# ha l'app con «Partita pubblica» accesa.
name: Sito web

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: sito-web
  cancel-in-progress: false

jobs:
  relay:
    if: contains(vars.SITO_WEB, 'cloudflare')
    runs-on: ubuntu-latest
    # i segreti di Cloudflare stanno nell'ambiente «cloudflare», che si apre solo da main e dai tag v*
    # (Settings → Environments): un ramo con un workflow cambiato non li può leggere
    environment: cloudflare
    outputs:
      url: ${{ steps.pubblica.outputs.url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Pubblica il relay su Cloudflare Workers
        id: pubblica
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Mancano i segreti CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID (vedi in cima a sito-web.yml)."
            exit 1
          fi
          npx --yes wrangler@4.149.0 deploy 2>&1 | tee uscita.txt
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' uscita.txt | head -1)
          if [ -z "$URL" ]; then echo "::warning::Non trovo l'indirizzo del relay nell'uscita di wrangler: uso la variabile SITO_RELAY."; fi
          echo "url=${URL/https:/wss:}" >> "$GITHUB_OUTPUT"

  costruisci:
    needs: relay
    if: ${{ !cancelled() && needs.relay.result != 'failure' }}
    runs-on: ubuntu-latest
    outputs:
      cloudflare: ${{ contains(vars.SITO_WEB, 'cloudflare') }}
      github: ${{ contains(vars.SITO_WEB, 'github') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Costruisci il sito
        env:
          SITO_URL: ${{ vars.SITO_URL }}
          SITO_RELAY: ${{ needs.relay.outputs.url || vars.SITO_RELAY }}
        run: node sviluppo/sito-web/costruisci.mjs _site
      - name: Il sito, scaricabile dalla pagina dell'esecuzione
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sito-web
          path: _site
          include-hidden-files: true
          retention-days: 14
      - name: Il pacchetto per GitHub Pages
        if: contains(vars.SITO_WEB, 'github')
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  cloudflare:
    needs: costruisci
    if: needs.costruisci.outputs.cloudflare == 'true'
    runs-on: ubuntu-latest
    environment: cloudflare
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sito-web
          path: _site
      - name: Pubblica su Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NOME: ${{ vars.SITO_CLOUDFLARE_NOME || 'libre-vtt' }}
        run: |
          set -e
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Mancano i segreti CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID (vedi in cima a sito-web.yml)."
            exit 1
          fi
          W="npx --yes wrangler@4.149.0"
          # la prima volta il progetto non c'è ancora: lo crea (se c'è già, va avanti)
          $W pages project create "$NOME" --production-branch=main 2>/dev/null || true
          $W pages deploy _site --project-name="$NOME" --branch=main --commit-dirty=true

  github:
    needs: costruisci
    if: needs.costruisci.outputs.github == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pubblica.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: pubblica
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
